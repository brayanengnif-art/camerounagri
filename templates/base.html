<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AgriData Cameroun{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --soil: #2d1b0e;
  --earth: #5c3317;
  --terracotta: #c0622f;
  --harvest: #e8a32e;
  --leaf: #3a7d44;
  --sage: #7aab5f;
  --mist: #f0ede6;
  --cream: #faf8f4;
  --text: #1a1208;
  --text-light: #6b5a44;
  --border: rgba(92,51,23,0.15);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
nav{background:var(--soil);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100}
.nav-brand{font-family:'Playfair Display',serif;color:var(--harvest);font-size:1.4rem;letter-spacing:0.02em;text-decoration:none}
.nav-brand span{color:var(--sage)}
.nav-links{display:flex;gap:2rem}
.nav-links a{color:rgba(255,255,255,0.75);text-decoration:none;font-size:0.9rem;font-weight:500;padding:0.4rem 0.8rem;border-radius:6px;transition:all .2s}
.nav-links a:hover,.nav-links a.active{color:var(--harvest);background:rgba(232,163,46,0.1)}
.container{max-width:1200px;margin:0 auto;padding:2rem}
.card{background:#fff;border-radius:16px;border:1px solid var(--border);padding:1.5rem;box-shadow:0 2px 12px rgba(45,27,14,0.06)}
.btn{display:inline-flex;align-items:center;gap:0.5rem;padding:0.7rem 1.5rem;border-radius:10px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;font-size:0.95rem;transition:all .2s;text-decoration:none}
.btn-primary{background:var(--leaf);color:#fff}
.btn-primary:hover{background:#2d6636;transform:translateY(-1px);box-shadow:0 4px 16px rgba(58,125,68,0.35)}
.btn-harvest{background:var(--harvest);color:var(--soil)}
.btn-harvest:hover{background:#d4921e;transform:translateY(-1px)}
.btn-danger{background:#fff;color:#c0392b;border:1px solid #e74c3c}
.btn-danger:hover{background:#fdf0ef}
.badge{display:inline-block;padding:0.25rem 0.75rem;border-radius:20px;font-size:0.8rem;font-weight:600}
.badge-green{background:rgba(58,125,68,0.12);color:var(--leaf)}
.badge-orange{background:rgba(192,98,47,0.12);color:var(--terracotta)}
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--soil);color:#fff;padding:1rem 1.5rem;border-radius:12px;font-size:0.9rem;z-index:999;transform:translateY(100px);opacity:0;transition:all .3s;border-left:4px solid var(--harvest)}
.toast.show{transform:translateY(0);opacity:1}
</style>
{% block extra_css %}{% endblock %}
</head>
<body>
<nav>
  <a href="/" class="nav-brand">Cameroun<span>Agri</span></a>
  <div class="nav-links">
    <a href="/" id="nav-accueil">Accueil</a>
    <a href="/collecte" id="nav-collecte">Collecte</a>
    <a href="/dashboard" id="nav-dashboard">Tableau de bord</a>
  </div>
</nav>
<div id="toast" class="toast"></div>
{% block content %}{% endblock %}
<script>
const path = window.location.pathname;
if(path==='/') document.getElementById('nav-accueil').classList.add('active');
if(path==='/collecte') document.getElementById('nav-collecte').classList.add('active');
if(path==='/dashboard') document.getElementById('nav-dashboard').classList.add('active');

function showToast(msg, color='var(--harvest)'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.borderLeftColor=color;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
